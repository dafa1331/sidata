{% load static %}
<!DOCTYPE html>
<html lang="en" class="light-style layout-menu-fixed" dir="ltr" data-theme="theme-default">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>{% block title %}Dashboard | Sneat{% endblock %}</title>
    
    <!-- CSS Dependencies -->
    <link rel="icon" type="image/x-icon" href="{% static 'sneat/img/favicon/logo.png' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'sneat/vendor/fonts/boxicons.css' %}" />
    <link rel="stylesheet" href="{% static 'sneat/vendor/css/core.css' %}" />
    <link rel="stylesheet" href="{% static 'sneat/vendor/css/theme-default.css' %}" />
    <link rel="stylesheet" href="{% static 'sneat/css/demo.css' %}" />
    <link rel="stylesheet" href="{% static 'sneat/vendor/libs/perfect-scrollbar/perfect-scrollbar.css' %}" />
    <link rel="stylesheet" href="{% static 'sneat/vendor/libs/apex-charts/apex-charts.css' %}" />

    <script src="{% static 'sneat/vendor/js/helpers.js' %}"></script>
    <script src="{% static 'sneat/js/config.js' %}"></script>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">
            
            <!-- Sidebar -->
            {% include 'includes/sidebar.html' %}

            <div class="layout-page">
                <!-- Navbar / Header -->
                {% include 'includes/navbar.html' %}

                <!-- Content wrapper -->
                <div class="content-wrapper">
                    <!-- Content Utama -->
                    <div class="container-xxl flex-grow-1 container-p-y">
                        {% block content %}
                        <!-- Konten spesifik halaman akan muncul di sini -->
                        {% endblock %}
                    </div>
                    <!-- / Content Utama -->

                    <!-- Footer -->
                    {% include 'includes/footer.html' %}
                    <div class="content-backdrop fade"></div>
                </div>
                <!-- / Content wrapper -->
            </div>
        </div>
        <div class="layout-overlay layout-menu-toggle"></div>
    </div>

    <!-- Core JS -->
    <script src="{% static 'sneat/vendor/libs/jquery/jquery.js' %}"></script>
    <script src="{% static 'sneat/vendor/libs/popper/popper.js' %}"></script>
    <script src="{% static 'sneat/vendor/js/bootstrap.js' %}"></script>
    <script src="{% static 'sneat/vendor/libs/perfect-scrollbar/perfect-scrollbar.js' %}"></script>
    <script src="{% static 'sneat/vendor/js/menu.js' %}"></script>
    <script src="{% static 'sneat/vendor/libs/apex-charts/apexcharts.js' %}"></script>
    <script src="{% static 'sneat/js/main.js' %}"></script>
    <script async defer src="https://buttons.github.io/buttons.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
