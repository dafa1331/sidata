{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-6 mx-auto">
    <div class="card">
      <div class="card-header"><h5 class="mb-0">{{ title }}</h5></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Kode (Singkatan)</label>
            {{ form.kode }}
          </div>
          <div class="mb-3">
            <label class="form-label">Nama Lengkap Tingkat</label>
            {{ form.nama }}
          </div>
          <div class="mb-3">
            <label class="form-label">Urutan Hirarki (1 = Terendah)</label>
            {{ form.urutan }}
          </div>
          <div class="mb-3 form-check">
            {{ form.is_active }}
            <label class="form-check-label">Aktif</label>
          </div>
          <button type="submit" class="btn btn-primary me-2">Simpan</button>
          <a href="{% url 'tingkat_pendidikan_list' %}" class="btn btn-outline-secondary">Batal</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
